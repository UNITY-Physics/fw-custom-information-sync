# ============================================================
# UNITY Custom Information Sync — Site Config Template
# Version: 2
# ============================================================
# Complete this file for your site and supply it as a gear
# input when running Custom Information Sync (Run 2).
#
# Only include keys relevant to your data. All keys with null
# or empty defaults are optional.
#
# Canonical field names come from utils/cde_template.yaml.
# ============================================================

# --- Subject / session matching ---

# REQUIRED: the column in your CSV that holds the subject identifier.
# The values in this column must exactly match the Flywheel subject labels
# for the project. If they don't match, fix the labels in Flywheel or in
# your CSV before running this gear.
id_field: "participant_id"

# How to match rows in your CSV to Flywheel sessions.
#   "label"        -> exact match on Flywheel session label (v1 default)
#   "date"         -> match on scan date (requires session_date_field below)
#   "subject_only" -> use when every subject has exactly one session
session_match: "label"

# Required when session_match is "date":
session_date_field: null          # your CSV column name for the scan date
session_date_format: "%Y-%m-%d"   # Python strptime format string
session_date_tolerance_days: 0    # allow +/- N days when matching dates

# --- Variable mapping ---

# Maps canonical field names to either:
#   - a column name string  -> gear reads values from that CSV column
#   - a scalar constant     -> gear writes that value for every session
#
# All canonical fields are listed below as commented-out entries.
# Uncomment and fill in any field whose column name in your CSV differs
# from the canonical name. Fields already named canonically in your CSV
# or covered by old_new_harmonization.yaml do NOT need to be listed here.
#
# Type key:  str=text  float=number  bool=true/false  list=multi-value

variable_map:

  # === Demographics ===

  # --- Study / cohort identifiers ---
  # CohortName: "your_column"                          # str
  # CohortLocation_city: "your_column"                 # str  (or constant e.g. "Nairobi")
  # CohortLocation_country: "your_column"              # str  (or constant e.g. "Kenya")
  # SubCohort_Group: "your_column"                     # str
  # StudyID: "your_column"                             # str
  # UniqueStudyID: "your_column"                       # str

  # --- Session / MRI metadata ---
  # MRI_fieldStrength: "your_column"                   # float
  # studyTimepoint: "your_column"                      # str  (e.g. "visit")
  # mriCollectedAtTimepoint: "your_column"             # bool

  # --- Timepoint anthropometrics ---
  # childTimepointAge_days: "your_column"              # float
  # childTimepointAge_months: "your_column"            # float
  # childTimepointHeight_cm: "your_column"             # float
  # childTimepointHeight_inches: "your_column"         # float
  # childTimepointWeight_kgs: "your_column"            # float
  # childTimepointWeight_lbs: "your_column"            # float
  # childTimepointHC_measured_cm: "your_column"        # float
  # childTimepointHC_MRI_cm: "your_column"             # float

  # --- Household composition ---
  # timepointFamilySize: "your_column"                 # float
  # timepoint_adultsLivingWithChild: "your_column"     # float
  # timepoint_otherChildrenLivingWithChild: "your_column" # float

  # --- Child characteristics ---
  # childBiologicalSex: "your_column"                  # str  (canonical values: "Male", "Female")
  # childGestation_days: "your_column"                 # float
  # childGestation_weeks: "your_column"                # float
  # childBirthWeight_lbs: "your_column"                # float
  # childBirthWeight_kgs: "your_column"                # float
  # childBirthLength_cm: "your_column"                 # float
  # childBirthLength_inches: "your_column"             # float
  # childBirthHC_cm: "your_column"                     # float
  # maternalAgeAtChildBirth_years: "your_column"       # float
  # childBirthOrdinal: "your_column"                   # float
  # childCountryOfBirth: "your_column"                 # str
  # childCityOfBirth: "your_column"                    # str
  # childRace: "your_column"                           # str
  # childEthnicity: "your_column"                      # str
  # childReligion: "your_column"                       # str
  # childCaste: "your_column"                          # str

  # === SES ===

  # MaternalEducation_HHS: "your_column"               # str
  # MaternalEducation_schoolingYears: "your_column"    # float

  # === Cognitive ===

  # -- GSED --
  # gsed_LongForm_DAZScore: "your_column"              # float
