# ============================================================
# UNITY Custom Information Sync — Site Config Template
# Version: 2
# ============================================================
# Complete this file for your site and supply it as a gear
# input when running Custom Information Sync (Run 2).
#
# Only include keys relevant to your data. All keys with null
# or empty defaults are optional.
#
# Canonical field names come from utils/cde_template.yaml.
# ============================================================

# --- Subject / session matching ---

# REQUIRED: the column in your CSV that holds the subject identifier.
# The values in this column must exactly match the Flywheel subject labels
# for the project. If they don't match, fix the labels in Flywheel or in
# your CSV before running this gear.
id_field: "participant_id"

# How to match rows in your CSV to Flywheel sessions.
#   "label"        -> exact match on Flywheel session label (v1 default)
#   "date"         -> match on scan date (requires session_date_field below)
#   "subject_only" -> use when every subject has exactly one session
session_match: "date"

# Required when session_match is "date":
session_date_field: null          # your CSV column name for the scan date
session_date_format: "%Y-%m-%d"   # Python strptime format string
session_date_tolerance_days: 0    # allow +/- N days when matching dates

# --- Variable mapping ---

# Maps a canonical field name to the name of the column in your CSV that holds
# its values.  Use this when your site uses a different column name for the same
# data (e.g. your file calls it "visit" but the canonical name is "studyTimepoint").
#
# Fields already named canonically in your CSV do NOT need an entry here.
# Fields covered by old_new_harmonization.yaml are also handled automatically.
#
# Type key:  str=text  float=number  bool=true/false  list=multi-value

variable_map:

  # === Demographics ===

  # --- Study / cohort identifiers ---
  # UniqueStudyID: "your_column"                       # str
  # SubCohort_Group: "your_column"                     # str  (if values vary per row)
  # CohortLocation_country: "your_column"              # str  (if values vary per row; use constant_map if same for all)
  # CohortLocation_city: "your_column"                 # str  (if values vary per row; use constant_map if same for all)

  # --- Session / MRI metadata ---
  # studyTimepoint: "your_column"                      # str  (e.g. rename "visit" → studyTimepoint)
  # mriCollectedAtTimepoint: "your_column"             # bool

  # --- Timepoint anthropometrics ---
  # childTimepointAge_days: "your_column"              # float
  # childTimepointAge_months: "your_column"            # float
  # childTimepointHeight_inches: "your_column"         # float  (use unit_map if source is cm)
  # childTimepointWeight_kgs: "your_column"            # float
  # childTimepointHC_measured_cm: "your_column"        # float
  # childTimepointHC_MRI_cm: "your_column"             # float

  # --- Household composition ---
  # timepointFamilySize: "your_column"                 # float
  # timepoint_adultsLivingWithChild: "your_column"     # float
  # timepoint_otherChildrenLivingWithChild: "your_column" # float

  # --- Child characteristics ---
  # childBiologicalSex: "your_column"                  # str  (canonical values: "Male", "Female")
  # childGestation_days: "your_column"                 # float
  # childGestation_weeks: "your_column"                # float
  # childBirthWeight_lbs: "your_column"                # float
  # childBirthWeight_kgs: "your_column"                # float
  # childBirthLength_inches: "your_column"             # float  (use unit_map if source is cm)
  # maternalAgeAtChildBirth_years: "your_column"       # float
  # childBirthOrdinal: "your_column"                   # float
  # childCountryOfBirth: "your_column"                 # str
  # childCityOfBirth: "your_column"                    # str
  # childRace: "your_column"                           # str
  # childEthnicity: "your_column"                      # str
  # childReligion: "your_column"                       # str
  # childCaste: "your_column"                          # str

  # === SES ===

  # MaternalEducation_HHS: "your_column"               # str
  # MaternalEducation_schoolingYears: "your_column"    # float

  # === Cognitive ===

  # -- GSED --
  # gsed_LongForm_DAZScore: "your_column"              # float
  # gsed_ShortForm_DAZScore: "your_column"             # float

  # -- MSEL --
  # msel_ELC: "your_column"                            # float
  # msel_VDQ: "your_column"                            # float
  # msel_NVDQ: "your_column"                           # float
  # msel_FM_T: "your_column"                           # float
  # msel_GM_T: "your_column"                           # float
  # msel_EL_T: "your_column"                           # float
  # msel_RL_T: "your_column"                           # float
  # msel_VR_T: "your_column"                           # float

  # -- BSID --
  # bsid_CCS: "your_column"                            # str
  # bsid_LCS: "your_column"                            # str
  # bsid_MCS: "your_column"                            # str
  # bsid_cognitiveScaled: "your_column"                # str
  # bsid_receptiveLanguageScaled: "your_column"        # str
  # bsid_expressiveLanguageScaled: "your_column"       # str
  # bsid_fineMotorScaled: "your_column"                # str
  # bsid_grossMotorScaled: "your_column"               # str
  # bsid_adaptiveBehaviorScaled: "your_column"         # str
  # bsid_socioemotionalScaled: "your_column"           # str

  # -- ASQ --
  # asq_Communication: "your_column"                   # float
  # asq_GrossMotor: "your_column"                      # float
  # asq_FineMotor: "your_column"                       # float
  # asq_ProblemSolving: "your_column"                  # float
  # asq_SocialIssues: "your_column"                    # float

  # -- WPPSI --
  # wppsi_FSIQ: "your_column"                          # float
  # wppsi_VCI: "your_column"                           # float
  # wppsi_VSI: "your_column"                           # float
  # wppsi_FRI: "your_column"                           # float
  # wppsi_WMI: "your_column"                           # float
  # wppsi_PSI: "your_column"                           # float
  # wppsi_bugSearchScales: "your_column"               # float
  # wppsi_cancellationScaled: "your_column"            # float
  # wppsi_pictureMemoryScaled: "your_column"           # float
  # wppsi_zooScaled: "your_column"                     # float
  # wppsi_blockDesignedScaled: "your_column"           # float
  # wppsi_objectAssemblyScaled: "your_column"          # float
  # wppsi_pictureConceptsScaled: "your_column"         # float
  # wppsi_matrixReasoningScaled: "your_column"         # float
  # wppsi_similaritiesScaled: "your_column"            # float
  # wppsi_vocabularyScaled: "your_column"              # float

  # -- WISC --
  # wisc_FSIQ: "your_column"                           # float
  # wisc_VCI: "your_column"                            # float
  # wisc_VSI: "your_column"                            # float
  # wisc_FRI: "your_column"                            # float
  # wisc_WMI: "your_column"                            # float
  # wisc_PSI: "your_column"                            # float
  # wisc_similaritiesScaled: "your_column"             # float
  # wisc_vocabScaled: "your_column"                    # float
  # wisc_BlockDesigScaled: "your_column"               # float
  # wisc_visualPuzzlesScaled: "your_column"            # float
  # wisc_matrixReasoningScaled: "your_column"          # float
  # wisc_figureWeightsScaled: "your_column"            # float
  # wisc_digitSpanScaled: "your_column"                # float
  # wisc_pictureSpanScaled: "your_column"              # float
  # wisc_CodingScaled: "your_column"                   # float
  # wisc_symbolSearchScaled: "your_column"             # float

  # -- AAB --
  # aab_lwrScaled: "your_column"                       # float
  # aab_mcScaled: "your_column"                        # float

  # === Clinical ===

  # childTimepointHealthGroup: "your_column"           # list

  # === Derived (WHO z-scores and nutritional status) ===
  # Tip: if your site computes z-scores independently, map them here.
  # Otherwise the gear can derive them from anthropometric inputs (planned).

  # BMI: "your_column"                                 # float
  # BMIZ: "your_column"                                # float
  # WAZ: "your_column"                                 # float
  # HAZ: "your_column"                                 # float
  # WHZ: "your_column"                                 # float
  # HCZ: "your_column"                                 # float
  # CurrentlyStunted: "your_column"                    # bool
  # CurrentlyWasted: "your_column"                     # bool
  # EverStunted: "your_column"                         # bool
  # EverWasted: "your_column"                          # bool

# --- Constant values ---

# Sets the same value for every session in this site's data.
# Use for fields that do not vary per participant: cohort name, country, city,
# scanner field strength, etc.
# These are written to every session regardless of what the CSV contains.
#
# Uncomment and fill in any that apply to your site.

constant_map:

  # --- Study / cohort identifiers ---
  # CohortName: "YourCohortName"                       # str  e.g. "LONISAC"
  # CohortLocation_country: "YourCountry"              # str  e.g. "South Africa"
  # CohortLocation_city: "YourCity"                    # str  e.g. "Cape Town"
  # SubCohort_Group: "YourGroup"                       # str  (if all rows share a sub-group)

  # --- MRI scanner ---
  # MRI_fieldStrength: 3.0                             # float  e.g. 1.5 or 3.0

# --- Value transforms ---

# Remap raw cell values in a column to canonical controlled-vocabulary values.
# Keys must be canonical field names that also appear in variable_map above.
#
# IMPORTANT: use block style (indented lines), NOT flow style ({...}).
# Correct:
#   value_map:
#     childBiologicalSex:
#       "yes": "Male"
#       "no": "Female"
# Wrong (causes YAML parse error):
#   value_map: {
#     childBiologicalSex: ...
#   }
value_map:

# --- Unit conversions ---

# Declare the source unit for fields where your data differs from the
# canonical unit. The gear converts before writing.
#
# Canonical units:
#   weight           -> kg
#   height / length  -> cm
#   head circumference -> cm
#   gestational age  -> weeks
#   age              -> days
#

  # childBirthWeight_kgs:
  #   source_unit: "lbs"
  #   target_unit: "kg"
  #   conversion: "multiply_by_0.453592"
  # childBirthLength_inches:
  #   source_unit: "cm"
  #   target_unit: "inches"
  #   conversion: "multiply_by_0.393701"


# IMPORTANT: use block style (indented lines), NOT flow style ({...}).
unit_map:

# --- Column filtering ---

# Columns to drop entirely before any processing (site-internal IDs,
# admin tracking columns, etc.). These will NOT appear in site_raw either.
drop_columns: []
# Example:
#   - "momid"
#   - "study_admin_notes"

# Regex pattern matching columns to route to the site_raw namespace in
# Flywheel custom info rather than the canonical mapping.
# Use for raw instrument item scores or other non-canonical data you want
# to preserve but not treat as canonical fields.
site_raw_pattern: null
# Example:  "^(gl1|gs1)"   # routes all GSED item-level columns to site_raw

# Prefix used when storing site_raw fields in Flywheel custom info.
# Fields are stored as:  custom_info["site_raw"]["<column_name>"]
site_raw_prefix: "site_raw"

# --- Optional non-imaging session controls ---

# Use these keys if your CSV includes visits that are not imaging sessions and
# you want the gear to create/update non-imaging sessions for those rows.

# Date column used for non-imaging candidate rows.
# If null, the gear falls back to session_date_field above.
non_imaging_date_field: null

# Date format used for non_imaging_date_field.
non_imaging_date_format: "%Y-%m-%d"

# Optional column used to classify visit type (example: "home_visit", "clinic").
non_imaging_visit_type_field: null

# Optional allowlist for visit-type values eligible for non-imaging creation.
# Leave empty to allow any visit type.
non_imaging_visit_type_allowlist: []

# Optional list of marker fields that indicate a row is a true non-imaging visit.
non_imaging_visit_marker_fields: []

# Optional explicit create override field (example column values yes/true/1).
non_imaging_force_create_field: null
non_imaging_force_create_values:
  - "yes"
  - "true"
  - "1"

# Optional regex filters for what fields are written onto non-imaging sessions.
# If include regex is set, only matching fields are considered.
# Exclude regex is applied after include filtering.
non_imaging_include_fields_regex: null
non_imaging_exclude_fields_regex: null
